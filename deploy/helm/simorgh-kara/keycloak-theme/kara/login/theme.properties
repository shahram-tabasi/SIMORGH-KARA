# Kara login theme for Keycloak 26.x (realm kara): keycloak.v2 (PatternFly 5)
# dressed as Kara's own login page \u2014 the welcome background, the Kara logo,
# a glass card, indigo button with an amber edge, Vazirmatn, right to left.
# Templates are Keycloak's own, so 26.x patches keep working; if a release
# renames PatternFly classes, review resources/css/kara.css.
parent=keycloak.v2
import=common/keycloak

# ?v= is filled in by the chart with a hash of these files (Keycloak serves
# theme files for 30 days; a changed theme must be a new address).
styles=css/styles.css css/kara.css?v=__THEME_VERSION__
scripts=js/kara.js?v=__THEME_VERSION__
# Dark only, like Kara's login page (js/kara.js sets PatternFly dark).
darkMode=false

locales=fa,en
