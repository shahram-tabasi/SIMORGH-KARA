# Kara email theme (realm kara): Keycloak's own emails (set up your account,
# reset password, verify email) in Persian, right to left, with Kara's dark
# header, its logo, an amber line, an indigo button and Kara's signature.
# Everything not overridden falls back to Keycloak's base theme.
# Non-ASCII text is written as \uXXXX: Java reads theme.properties as Latin-1.
parent=base
locales=fa,en

# Edit these to change every email at once, then upgrade the chart.
appName=\u0633\u06cc\u0645\u0631\u063a\u200c\u06a9\u0627\u0631\u0627
appTagline=\u0633\u0627\u0645\u0627\u0646\u0647\u0654 \u06cc\u06a9\u067e\u0627\u0631\u0686\u0647\u0654 \u0645\u062f\u06cc\u0631\u06cc\u062a \u0633\u0627\u0632\u0645\u0627\u0646
appUrl=https://kara.simorghai.com
appUrlLabel=kara.simorghai.com
# Embedded in each message (cid:, by the simorgh-inline-images email sender):
# resources/img/kara-logo.png. Gold on transparent: reads on the dark header
# and on the white signature alike.
logoUrl=cid:kara-logo.png

signatureName=\u0633\u06cc\u0645\u0631\u063a\u200c\u06a9\u0627\u0631\u0627
signatureTitle=\u067e\u0634\u062a\u06cc\u0628\u0627\u0646\u06cc \u0633\u0627\u0645\u0627\u0646\u0647
signatureOrg=\u0633\u06cc\u0645\u0631\u063a
supportEmail=
supportPhone=
copyright=\u0633\u06cc\u0645\u0631\u063a

inkColor=#0a0712
amberColor=#f59e0b
amberSoft=#fcd34d
buttonColor=#4f46e5
