{{- $ns := include "kara.namespace" . -}}
{{- $kc := .Values.keycloak -}}
{{- $a := .Values.api -}}
apiVersion: v1
kind: Service
metadata:
  name: kara-api
  namespace: {{ $ns }}
  labels:
    {{- include "kara.labels" . | nindent 4 }}
    app.kubernetes.io/name: kara-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kara-api
  ports:
    - name: http
      port: 3001
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kara-api
  namespace: {{ $ns }}
  labels:
    {{- include "kara.labels" . | nindent 4 }}
    app.kubernetes.io/name: kara-api
spec:
  replicas: {{ $a.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kara-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "kara.labels" . | nindent 8 }}
        app.kubernetes.io/name: kara-api
    spec:
      {{- include "kara.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "kara.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kara-api
      containers:
        - name: kara-api
          image: {{ include "kara.image" (dict "root" . "repo" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            {{- include "kara.dbEnv" . | nindent 12 }}
            - name: KEYCLOAK_ISSUER
              value: {{ $kc.issuer | quote }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ $kc.internalUrl | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: kara-api
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $kc.existingSecret }}, key: apiClientSecret }
            - name: TRUSTED_CLIENTS
              value: kara-web
            - name: INVITE_REDIRECT_URI
              value: {{ printf "https://%s/auth/login" .Values.kara.host | quote }}
            - name: BROKERED_DOMAINS
              value: {{ $kc.brokeredDomains | quote }}
            - name: ERP_CONNECTOR_URL
              value: {{ $a.erp.connectorUrl | quote }}
            - name: ERP_TOKEN_URL
              value: {{ $a.erp.tokenUrl | quote }}
            - name: ERP_CLIENT_ID
              value: kara-api
            - name: ERP_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $kc.existingSecret }}, key: erpClientSecret, optional: true }
            # Kara → the apps' realms (docs/INTEGRATION.md). Design Suite's realm
            # uses the kara-api client above; realm hr its kara-provisioner
            # (setup-realm.sh app-realms). A realm without a secret is skipped.
            - name: PROVISION_ENABLED
              value: {{ $a.provision.enabled | quote }}
            - name: CONTEXT_SERVICE_CLIENTS
              value: {{ $a.contextServiceClients | quote }}
            - name: PROVISION_HR_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $kc.existingSecret }}, key: hrProvisionerSecret, optional: true }
            - name: KAFKA_BROKERS
              value: {{ $a.kafka.brokers | quote }}
            - name: JITSI_URL
              value: {{ $a.jitsi.url | quote }}
            - name: JITSI_SUBJECT
              value: {{ $a.jitsi.subject | quote }}
            - name: JITSI_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $a.jitsi.existingSecret }}, key: jwtSecret, optional: true }
            # Team Platform (docs/TEAM-PLATFORM.md): Plane and Mattermost. The
            # credentials are in Secret kara-team (deploy/team-platform/phase2/
            # setup.sh); each part stays off while its key is missing.
            - name: PLANE_URL
              value: {{ $a.team.plane.url | quote }}
            - name: PLANE_PUBLIC_URL
              value: {{ $a.team.plane.publicUrl | quote }}
            - name: PLANE_WORKSPACE
              value: {{ $a.team.plane.workspace | quote }}
            - name: MATTERMOST_URL
              value: {{ $a.team.mattermost.url | quote }}
            - name: MATTERMOST_PUBLIC_URL
              value: {{ $a.team.mattermost.publicUrl | quote }}
            {{- range $env, $key := dict "PLANE_API_KEY" "planeApiKey" "PLANE_WEBHOOK_SECRET" "planeWebhookSecret" "MATTERMOST_ADMIN_TOKEN" "mattermostAdminToken" "MATTERMOST_BOT_TOKEN" "mattermostBotToken" "MATTERMOST_COMMAND_TOKENS" "mattermostCommandTokens" "ASSISTANT_SERVICE_TOKEN" "assistantServiceToken" "SSO_PLANE_CLIENT_SECRET" "ssoPlaneSecret" "SSO_MATTERMOST_CLIENT_SECRET" "ssoMattermostSecret" "SSO_KEYCLOAK_CLIENT_SECRET" "ssoKeycloakSecret" "LLM_API_KEY" "llmApiKey" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef: { name: {{ $a.team.existingSecret }}, key: {{ $key }}, optional: true }
            {{- end }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext:
            {{- include "kara.containerSecurity" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kara-api
  namespace: {{ $ns }}
  labels:
    {{- include "kara.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kara-api
