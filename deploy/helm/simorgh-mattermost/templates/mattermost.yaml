{{- $ns := include "mm.namespace" . -}}
{{- $m := .Values.mattermost -}}
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
    app.kubernetes.io/name: mattermost
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/component: server
spec:
  replicas: 1                 # Team Edition: one server, no clustering
  strategy:
    type: Recreate            # never two servers migrating the same database
  selector:
    matchLabels:
      app.kubernetes.io/name: mattermost
  template:
    metadata:
      labels:
        {{- include "mm.labels" . | nindent 8 }}
        app.kubernetes.io/name: mattermost
    spec:
      {{- include "mm.imagePullSecrets" . | nindent 6 }}
      {{- with $m.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000         # mattermost, in the official image
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mattermost
          image: {{ include "mm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8065
          env:
            - name: TZ
              value: {{ $m.timezone | quote }}
            # ── Database; the configuration lives in it too (MM_CONFIG), so
            # System Console changes survive restarts. Settings set below are
            # fixed by the chart and show read-only in the console.
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgresql.existingSecret }}, key: username }
            - name: DB_PASSWORD   # hex: safe inside a URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgresql.existingSecret }}, key: password }
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@mattermost-postgresql:5432/{{ .Values.postgresql.database }}?sslmode=disable&connect_timeout=10"
            - name: MM_CONFIG
              value: "$(MM_SQLSETTINGS_DATASOURCE)"
            # ── Service
            - { name: MM_SERVICESETTINGS_SITEURL, value: {{ $m.siteUrl | quote }} }
            - { name: MM_SERVICESETTINGS_LISTENADDRESS, value: ":8065" }
            - { name: MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION, value: {{ $m.enableBots | quote }} }
            - { name: MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS, value: {{ $m.enableUserAccessTokens | quote }} }
            - { name: MM_SERVICESETTINGS_ENABLEONLYADMININTEGRATIONS, value: {{ $m.onlyAdminIntegrations | quote }} }
            - { name: MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS, value: {{ $m.allowedUntrustedInternalConnections | quote }} }
            # mmctl --local inside the pod (unix socket only): first admin, bot.
            - { name: MM_SERVICESETTINGS_ENABLELOCALMODE, value: "true" }
            - { name: MM_SERVICESETTINGS_ENABLESECURITYFIXALERT, value: "false" }
            # ── Who may join
            - { name: MM_TEAMSETTINGS_ENABLEOPENSERVER, value: {{ $m.openServer | quote }} }
            - { name: MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS, value: {{ $m.restrictCreationToDomains | quote }} }
            # ── No calls to the internet
            - { name: MM_PLUGINSETTINGS_ENABLEMARKETPLACE, value: {{ $m.marketplace | quote }} }
            - { name: MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE, value: "false" }
            - { name: MM_PLUGINSETTINGS_ENABLEUPLOADS, value: "false" }
            - { name: MM_LOGSETTINGS_ENABLEDIAGNOSTICS, value: {{ $m.diagnostics | quote }} }
            - { name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS, value: {{ $m.push.enabled | quote }} }
            - { name: MM_EMAILSETTINGS_PUSHNOTIFICATIONCONTENTS, value: {{ $m.push.contents | quote }} }
            # ── Files: Ceph RGW
            - { name: MM_FILESETTINGS_DRIVERNAME, value: {{ $m.files.driver | quote }} }
            - { name: MM_FILESETTINGS_AMAZONS3ENDPOINT, value: {{ $m.files.endpoint | quote }} }
            - { name: MM_FILESETTINGS_AMAZONS3SSL, value: {{ $m.files.ssl | quote }} }
            - { name: MM_FILESETTINGS_AMAZONS3BUCKET, value: {{ $m.files.bucket | quote }} }
            - { name: MM_FILESETTINGS_AMAZONS3REGION, value: {{ $m.files.region | quote }} }
            - { name: MM_FILESETTINGS_AMAZONS3SIGNV2, value: "false" }
            - { name: MM_FILESETTINGS_MAXFILESIZE, value: {{ mul $m.files.maxFileSizeMB 1048576 | quote }} }
            - name: MM_FILESETTINGS_AMAZONS3ACCESSKEYID
              valueFrom:
                secretKeyRef: { name: {{ $m.files.existingSecret }}, key: accessKeyId }
            - name: MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY
              valueFrom:
                secretKeyRef: { name: {{ $m.files.existingSecret }}, key: secretAccessKey }
            {{- if $m.smtp.enabled }}
            # ── Mail: mailcow
            - { name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS, value: "true" }
            - { name: MM_EMAILSETTINGS_SMTPSERVER, value: {{ $m.smtp.host | quote }} }
            - { name: MM_EMAILSETTINGS_SMTPPORT, value: {{ $m.smtp.port | quote }} }
            - { name: MM_EMAILSETTINGS_CONNECTIONSECURITY, value: {{ $m.smtp.security | quote }} }
            - { name: MM_EMAILSETTINGS_ENABLESMTPAUTH, value: "true" }
            - { name: MM_EMAILSETTINGS_SMTPUSERNAME, value: {{ $m.smtp.user | quote }} }
            - { name: MM_EMAILSETTINGS_FEEDBACKEMAIL, value: {{ $m.smtp.from | quote }} }
            - { name: MM_EMAILSETTINGS_REPLYTOADDRESS, value: {{ $m.smtp.from | quote }} }
            - { name: MM_EMAILSETTINGS_FEEDBACKNAME, value: {{ $m.smtp.fromName | quote }} }
            - name: MM_EMAILSETTINGS_SMTPPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $m.smtp.existingSecret }}, key: password, optional: true }
            {{- end }}
            {{- range $k, $v := $m.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # First start runs the schema migrations: give it up to 10 minutes.
          startupProbe:
            httpGet: { path: /api/v4/system/ping, port: http }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/v4/system/ping, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v4/system/ping, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          # Files and plugin bundles are in S3 and the database; these are
          # scratch, rebuilt at every start.
          volumeMounts:
            - { name: scratch, mountPath: /mattermost/config, subPath: config }
            - { name: scratch, mountPath: /mattermost/data, subPath: data }
            - { name: scratch, mountPath: /mattermost/logs, subPath: logs }
            - { name: scratch, mountPath: /mattermost/plugins, subPath: plugins }
            - { name: scratch, mountPath: /mattermost/client/plugins, subPath: client-plugins }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
