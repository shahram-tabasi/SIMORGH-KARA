{{- if .Values.gateway.enabled }}
{{- $ns := include "mm.namespace" . -}}
{{- $g := .Values.gateway -}}
{{- if $g.ipPool.enabled }}
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ $g.ipPool.name }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  blocks:
    - start: {{ $g.loadBalancerIP }}
      stop: {{ $g.loadBalancerIP }}
  serviceSelector:
    matchLabels:
      {{ $g.poolLabel.key }}: {{ $g.poolLabel.value }}
---
{{- end }}
{{- if $g.l2Announcement.enabled }}
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: simorgh-{{ $g.name }}-l2
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  serviceSelector:
    matchLabels:
      {{ $g.poolLabel.key }}: {{ $g.poolLabel.value }}
  interfaces: {{ toJson $g.l2Announcement.interfaces }}
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values: {{ toJson $g.l2Announcement.nodes }}
  externalIPs: true
  loadBalancerIPs: true
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  infrastructure:
    labels:
      {{ $g.poolLabel.key }}: {{ $g.poolLabel.value }}
    annotations:
      lbipam.cilium.io/ips: {{ $g.loadBalancerIP | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.mattermost.host }}
      allowedRoutes: { namespaces: { from: Same } }
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.mattermost.host }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $g.tlsSecret }}
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $g.name }}-https-redirect
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ $g.name }}, sectionName: http }]
  hostnames: [{{ .Values.mattermost.host }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $g.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ $g.name }}, sectionName: https }]
  hostnames: [{{ .Values.mattermost.host }}]
  rules:
    # Every client keeps one websocket open for new messages.
    - matches:
        - path: { type: PathPrefix, value: /api/v4/websocket }
      backendRefs: [{ name: mattermost, port: 8065 }]
      timeouts: { request: 0s }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs: [{ name: mattermost, port: 8065 }]
      timeouts: { request: 600s }    # large uploads
{{- end }}
