# Who may talk to whom in namespace plane (decision 9, docs/TEAM-PLATFORM.md);
# the simorgh-website pattern.
#
#   kubectl apply -f deploy/team-platform/plane/policies.yaml
#
# Inside the namespace everything may talk (web, api, workers, live, the
# databases are one application). From outside: only the Gateway's 80/443.
# Out of it: DNS, istiod, Ceph RGW (files) and mailcow's submission port.
# No internet: the nodes have none worth relying on, and Plane runs without it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# istiod: the Gateway's configuration and the workload certificates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-istio-control-plane, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }
      ports:
        - { protocol: TCP, port: 15012 }
        - { protocol: TCP, port: 15010 }
        - { protocol: TCP, port: 15014 }
        - { protocol: TCP, port: 443 }
---
# Pod to pod inside the namespace, any port (15008 is the ambient tunnel).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-same-namespace, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: {} }]
  egress:
    - to: [{ podSelector: {} }]
---
# Browsers reaching the Gateway; 15021 is its readiness port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-gateway, namespace: plane }
spec:
  podSelector:
    matchLabels: { gateway.networking.k8s.io/gateway-name: plane }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 15021 }
---
# kubelet's HTTP probe on the API comes from the node, SNAT'd by istio-cni to
# 169.254.7.127, which no selector names: the port is open at L3/L4; the
# PeerAuthentication below still refuses plaintext from anything but kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-probes-to-api, namespace: plane }
spec:
  podSelector:
    matchLabels: { app.name: plane-plane-api }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 8000 }]
---
# Out: Ceph RGW (the API and workers store files; the Gateway serves the
# signed /plane-uploads links) and mailcow's 587 (invites, notifications).
# Nothing else on .68: its 443 is the edge nginx, which trusts LAN callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-egress-rgw-mail, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 192.168.1.92/32 } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ ipBlock: { cidr: 192.168.1.68/32 } }]
      ports: [{ protocol: TCP, port: 587 }]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: plane }
spec:
  mtls: { mode: STRICT }
---
# Ceph RGW listens on 192.168.1.92, which is worker1, a cluster node. Cilium
# gives node addresses the identities host/remote-node, so the ipBlock above
# never matches them (the first install's create_bucket was cut off). Allow
# the RGW port to the nodes, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: allow-egress-rgw-on-nodes, namespace: plane }
spec:
  endpointSelector: {}
  egress:
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
# Kara (Phase 2, docs/TEAM-PLATFORM.md): Plane's worker posts the workspace
# webhook to kara-api (signed), and kara-api reads Plane's API (backfill,
# invitations, the assistant). 15008 is the ambient tunnel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-egress-to-kara-api, namespace: plane }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kara } }
          podSelector: { matchLabels: { app.kubernetes.io/name: kara-api } }
      ports:
        - { protocol: TCP, port: 3001 }
        - { protocol: TCP, port: 15008 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-kara-to-api, namespace: plane }
spec:
  podSelector:
    matchLabels: { app.name: plane-plane-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kara } }
          podSelector: { matchLabels: { app.kubernetes.io/name: kara-api } }
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 15008 }
