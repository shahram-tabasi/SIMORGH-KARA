services:
  db:
    image: postgres:16-alpine
    container_name: simorgh_ledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: simorgh
      POSTGRES_PASSWORD: simorgh
      POSTGRES_DB: simorgh_ledger
    ports:
      - "5432:5432"
    volumes:
      - simorgh_ledger_pgdata:/var/lib/postgresql/data

  # شبیه‌ساز داده‌های سلامت برای تست (اختیاری)
  health-simulator:
    image: node:18-alpine
    working_dir: /app
    command: >
      sh -c "
      apk add --no-cache npm &&
      npm install node-fetch &&
      node simulator.js
      "
    environment:
      - API_URL=http://host.docker.internal:3000/api/v1/hrc/health
      - DEVICE_ID=qcy-gateway-01
      - EMPLOYEE_ID=emp-001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - simorgh-network
    profiles:
      - simulator

volumes:
  simorgh_ledger_pgdata:

networks:
  simorgh-network:
    driver: bridge
